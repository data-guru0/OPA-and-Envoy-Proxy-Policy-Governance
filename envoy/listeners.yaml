# Envoy listeners.
#
#   :8000  ingress   browser   -> assistant   plain proxy (serves the UI)
#   :9000  egress    assistant -> bank-api    every tool call is paused by the ext_authz filter, sent to OPA over gRPC,
#                                             and only forwarded if OPA answers allowed=true
#
# The control plane renders this file for Envoy. The Operations tab in the UI can flip `failure_mode_allow` and
# point `cluster_name` at an unreachable OPA, live. Editing this file by hand also applies within ~2 s.

resources:
  # ---------------------------------------------------------------- ingress: browser -> assistant (no policy check)
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 8000 }
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                virtual_hosts:
                  - name: assistant
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/ops/" }            # control plane API used by the UI tabs
                        route: { cluster: control, timeout: 30s }
                      - match: { prefix: "/" }                # the UI page and the chat API
                        route: { cluster: assistant, timeout: 180s }
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ---------------------------------------------------------------- egress: assistant -> bank-api (the PEP)
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: egress
    address:
      socket_address: { address: 0.0.0.0, port_value: 9000 }
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: egress
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[egress] %REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% %RESPONSE_CODE_DETAILS%\n"
              route_config:
                virtual_hosts:
                  - name: bank_api
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/tools/" }          # every tool call is checked by OPA
                        route: { cluster: bank_api, timeout: 30s }
              http_filters:
                - name: envoy.filters.http.ext_authz       # 1. pause the request and ask OPA
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                    transport_api_version: V3
                    grpc_service:
                      envoy_grpc: { cluster_name: opa }
                      timeout: 1s
                    with_request_body: { max_request_bytes: 8192, allow_partial_message: false }  # OPA sees the tool args
                    failure_mode_allow: false      # OPA down or no answer -> DENY (fail-closed)
                - name: envoy.filters.http.router          # 2. only reached if OPA allowed: forward to bank-api
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
